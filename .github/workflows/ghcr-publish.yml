name: Build and Push to GHCR

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Image tag name (e.g. v2026.8.13). If empty, uses branch/tag name.'
        required: false
        default: ''
      platforms:
        description: 'Target platform(s)'
        required: false
        default: 'amd64'
        type: choice
        options:
          - 'amd64'
          - 'all'
          - 'arm64'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Get version tag
        id: vars
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set platform matrix
        id: set-matrix
        run: |
          CHOICE="${{ github.event.inputs.platforms || 'amd64' }}"
          if [ "$CHOICE" = "all" ]; then
            echo 'matrix=["linux/amd64", "linux/arm64"]' >> $GITHUB_OUTPUT
          elif [ "$CHOICE" = "arm64" ]; then
            echo 'matrix=["linux/arm64"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["linux/amd64"]' >> $GITHUB_OUTPUT
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hermes-agent,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          TAGS="--tag ghcr.io/${{ github.repository_owner }}/hermes-agent:latest"
          if [ "$TAG" != "latest" ]; then
            TAGS="$TAGS --tag ghcr.io/${{ github.repository_owner }}/hermes-agent:$TAG"
          fi
          
          docker buildx imagetools create $(printf 'ghcr.io/${{ github.repository_owner }}/hermes-agent@sha256:%s ' *) $TAGS

      - name: Inspect image
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/hermes-agent:$TAG
