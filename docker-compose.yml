services:
  hermes:
    image: ghcr.io/kuniakil/hermes-agent:v2026.4.23-ssh
    container_name: hermes-agent
    ports:
      - "2222:22"
    volumes:
      - ./data:/opt/data
    environment:
      - HERMES_HOME=/opt/data
      - TZ=Asia/Taipei
    env_file:
      - ./data/.env
    command: gateway run
    stdin_open: true
    tty: true
    restart: always
