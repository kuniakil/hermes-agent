services:
  hermes:
    image: ghcr.io/kuniakil/hermes-agent:v2026.4.23
    container_name: hermes-agent
    volumes:
      - ./data:/opt/data
#      - .:/opt/hermes:ro
    environment:
      - HERMES_HOME=/opt/data
      - TZ=Asia/Taipei
    command: gateway run
    stdin_open: true
    tty: true
    restart: always
