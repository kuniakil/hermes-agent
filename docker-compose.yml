services:
  hermes:
    image: ${HERMES_IMAGE}
    container_name: hermes-agent
    ports:
      - "2222:22"
    volumes:
      - ./data:/opt/data
    environment:
      - HERMES_HOME=/opt/data
      - TZ=Asia/Taipei
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    env_file:
      - ./data/.env
    command: gateway run
    stdin_open: true
    tty: true
    restart: always
